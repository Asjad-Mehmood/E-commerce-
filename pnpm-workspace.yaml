packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency install scripts by default; allow the ones we need.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - argon2
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# Security fixes for transitive dependencies (pnpm audit).
overrides:
  postcss: ^8.5.32
