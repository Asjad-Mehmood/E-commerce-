name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hoodie
          POSTGRES_PASSWORD: hoodie
          POSTGRES_DB: hoodie_store
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hoodie -d hoodie_store"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://hoodie:hoodie@localhost:5432/hoodie_store?schema=public
      SEED_ADMIN_PASSWORD: CiAdmin123
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations and seed
        run: |
          pnpm db:deploy
          pnpm db:seed

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hoodie
          POSTGRES_PASSWORD: hoodie
          POSTGRES_DB: hoodie_store
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hoodie -d hoodie_store"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://hoodie:hoodie@localhost:5432/hoodie_store?schema=public
      SEED_ADMIN_PASSWORD: CiAdmin123
      JWT_ACCESS_SECRET: ci-only-secret-at-least-32-characters-long
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @hoodie/storefront exec playwright install --with-deps chromium

      - name: Migrate and seed
        run: |
          pnpm db:deploy
          pnpm db:seed

      - name: Build
        run: pnpm build

      - name: Run end-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/storefront/playwright-report
          retention-days: 7
